name: Visual Investigator Benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "prompts/**"
      - "run_benchmark.py"
      - "vi_benchmark.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model ID"
        required: true
        default: "gemini-3.8-flash"
        type: string
      condition:
        description: "Benchmark condition"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - baseline
          - investigator

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BENCHMARK_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
      BENCHMARK_CONDITION: ${{ inputs.condition || 'both' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -q pytest

      - name: Validate benchmark harness
        run: python -m pytest -q

      - name: Run baseline
        if: ${{ env.BENCHMARK_CONDITION == 'baseline' || env.BENCHMARK_CONDITION == 'both' }}
        continue-on-error: true
        run: python run_benchmark.py --provider gemini --model "${{ env.BENCHMARK_MODEL }}" --condition baseline --output "runs/${{ env.BENCHMARK_MODEL }}-baseline.jsonl"

      - name: Run investigator
        if: ${{ env.BENCHMARK_CONDITION == 'investigator' || env.BENCHMARK_CONDITION == 'both' }}
        continue-on-error: true
        run: python run_benchmark.py --provider gemini --model "${{ env.BENCHMARK_MODEL }}" --condition investigator --output "runs/${{ env.BENCHMARK_MODEL }}-investigator.jsonl"

      - name: Upload benchmark outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-investigator-benchmark-${{ env.BENCHMARK_MODEL }}-${{ github.run_number }}
          path: runs/*.jsonl
          if-no-files-found: warn

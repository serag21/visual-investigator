[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-investigator"
version = "0.1.0"
description = "Evidence-driven visual investigation benchmark and tooling"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
vi-validate = "vi_benchmark:main_validate"
vi-score = "vi_benchmark:main_score"
vi-grade = "vi_grade:main"

[tool.setuptools]
py-modules = ["vi_benchmark", "vi_grade"]

[tool.pytest.ini_options]
pythonpath = ["."]
